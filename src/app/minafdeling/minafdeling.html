<div class="container-fluid bg-light py-4 border-bottom">
    <div class="row">
        <div class="col-12 col-md-6 col-lg-4">
            <h2 class="text-navy fw-bold mb-3 h4">Find din boligafdelings
                hjemmeside</h2>

            <div
                class="input-group shadow-sm border-navy rounded-3 bg-white overflow-hidden">
                <span class="input-group-text bg-white border-0 ps-3">
                    <i class="fa fa-search text-muted"></i>
                </span>
                <input type="text"
                    [ngModel]="searchText()"
                    (ngModelChange)="searchText.set($event)"
                    placeholder="Søg efter afdeling..."
                    class="form-control border-0 py-2 shadow-none department-search-input">
            </div>
        </div>
    </div>
</div>

<div class="container-fluid py-4">
    <div class="row g-3 row-cols-custom-5">
        @for (dept of filteredDepartments(); track dept.name) {
        <div class="col">
            <div class="card h-100 dept-card border shadow-sm border-light">
                <div class="card-body d-flex flex-column p-3">

                    <h3 class="card-title h6 fw-bold mb-2">{{
                        dept.name }}</h3>
                    <hr class="my-2 opacity-25">

                    <p class="address fw-bold mb-2 small">{{
                        dept.address }}</p>

                    <div class="contact-info mb-3">
                        <p class="small mb-1 d-flex align-items-center gap-2">
                            <i class="fa fa-phone"></i>
                            {{ dept.phone }}
                        </p>
                        <p
                            class="small mb-0 d-flex align-items-center gap-2 text-danger fw-medium">
                            <i class="fa fa-envelope"></i>
                            {{ dept.email }}
                        </p>
                    </div>

                    <button
                        class="btn btn-fsb-red w-100 fw-bold py-2 mb-2 x-small-text">
                        Skriv til ejendomskontoret
                    </button>

                    <div class="info-section bg-light rounded-2 p-2 my-2">
                        <div class="mb-2">
                            <label
                                class="d-block text-uppercase fw-bold text-muted mb-0"
                                style="font-size: 0.65rem;">Telefontid</label>
                            <span class="fw-bold text-navy small">{{
                                dept.telefontid }}</span>
                        </div>
                        <div>
                            <label
                                class="d-block text-uppercase fw-bold text-muted mb-0"
                                style="font-size: 0.65rem;">Åbningstid</label>
                            <span class="fw-bold text-navy small">{{
                                dept.opening }}</span>
                        </div>
                    </div>

                    <button
                        class="btn btn-fsb-red-outline w-100 fw-bold py-2 mt-auto x-small-text"
                        routerLink="/acuthelp">
                        Akut hjælp
                    </button>

                </div>
            </div>
        </div>
        } @empty {
        <div class="col-12 text-center py-5">
            <p class="text-muted fs-5">Ingen afdelinger fundet med:
                <strong>"{{ searchText() }}"</strong></p>
        </div>
        }
    </div>
</div>
