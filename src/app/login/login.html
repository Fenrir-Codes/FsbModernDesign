<div class="login-container d-flex flex-column align-items-center justify-content-center h-100">
    
    <div class="card border-0 shadow-lg rounded-2 overflow-hidden" style="max-width: 450px; width: 100%; background-color: #f8f9fa;">
        
        <div class="card-header bg-white border-bottom border-light py-4 text-center">
            <h5 class="mb-0 fw-bold text-navy">Log ind med e-mail</h5>
        </div>

        <div class="card-body p-4 p-md-5">
            <form class="login-form">
                <div class="mb-4">
                    <label class="form-label fw-semibold text-navy">E-mail</label>
                    <input type="email" placeholder="Din e-mail adresse" 
                           class="form-control form-control-lg border-2 custom-focus">
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold text-navy">Kode</label>
                    <input type="password" placeholder="Din adgangskode" 
                           class="form-control form-control-lg border-2 custom-focus">
                </div>

                <div class="d-flex gap-3">
                    <button class="btn btn-fsb-red btn-lg w-100 fw-bold shadow-sm">Log ind</button>
                    <button class="btn btn-fsb-red-outline btn-lg w-100 fw-bold shadow-sm">Få kode</button>
                </div>
            </form>
        </div>

        <div class="card-footer bg-white border-top border-light py-3 px-4 d-flex justify-content-between align-items-center cursor-pointer hover-bg-light transition">
            <div class="d-flex align-items-center gap-2">
                <span class="fw-bold text-navy">Log ind med</span>
                <img src="./MitID.png" style="width: 70px;" alt="MitID">
            </div>
            <i class="fa fa-chevron-right text-navy opacity-50"></i>
        </div>
    </div>

    <div class="info-alert-card mt-4 p-3 bg-white shadow-sm rounded-3 border-start border-5 border-fsb-red" style="max-width: 450px; width: 100%;">
        <div class="d-flex align-items-center gap-3">
            <div class="info-icon bg-navy text-white rounded-circle d-flex align-items-center justify-content-center flex-shrink-0" style="width: 24px; height: 24px;">i</div>
            <p class="mb-0 small text-navy">
                Du logger ind med den e-mail og adgangskode, du har registreret dig med hos fsb.
            </p>
        </div>
    </div>
</div>
